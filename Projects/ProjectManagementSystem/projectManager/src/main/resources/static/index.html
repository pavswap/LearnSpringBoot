<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside>
  <h1><i class="logo"></i><span>Project Manager</span></h1>
  <div class="lbl"><span>Projects</span><button class="btn ghost" id="newProj" style="padding:2px 9px" title="New project">+</button></div>
  <div class="plist" id="plist"></div>
  <div class="side-foot">API: <span id="apiLbl"></span><br><button id="apiBtn">Change server URL</button></div>
</aside>
<main>
  <div class="top" id="top" hidden>
    <div class="crumb">Projects / <span id="crumb"></span></div>
    <input class="title" id="pname" aria-label="Project name">
    <input class="desc" id="pdesc" aria-label="Project description" placeholder="Add a description">
    <div class="bar">
      <input class="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
      <div class="chips" id="chips"></div>
      <span class="sp"></span>
      <button class="btn danger" id="delProj">Delete project</button>
      <button class="btn" id="newTask">Create task</button>
    </div>
  </div>
  <div class="board" id="board"></div>
</main>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
